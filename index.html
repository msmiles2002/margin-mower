<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Margin Mower</title>
    <meta name="description" content="Can you mow on budget? A BomData game." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="board"></canvas>
      <div id="controls" hidden>
        <span id="controls-hint" class="controls-hint" hidden>
          <span class="touch">Tap a button or swipe</span><span class="keys">Click a button or press ↑ ↓</span>
        </span>
        <button id="hop-button" class="hop" type="button">
          <span class="cap">↑</span><span class="name">HOP</span>
          <span class="chips"><span class="chip touch">tap</span><span class="chip touch">swipe ↑</span><span class="chip keys">W</span><span class="chip keys">space</span></span>
        </button>
        <button id="duck-button" class="duck" type="button">
          <span class="cap">↓</span><span class="name">DUCK <br />&amp; PULL</span>
          <span class="chips"><span class="chip touch">tap</span><span class="chip touch">swipe ↓</span><span class="chip keys">S</span></span>
        </button>
      </div>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
